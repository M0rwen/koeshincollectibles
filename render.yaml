# Place this file in the ROOT of the repo (next to /backend and /frontend).
services:
  # ───────────── Backend: Node/Express API ─────────────
  - type: web
    name: koeshin-api
    runtime: node
    region: singapore
    plan: free
    branch: ui-polish
    rootDir: backend
    buildCommand: npm install
    # Copies the Firebase key (added as a Secret File in the dashboard) to where
    # config/firebaseAdmin.js expects it, then starts the server.
    startCommand: cp /etc/secrets/firebase-service-account.json config/firebase-service-account.json && node server.js
    healthCheckPath: /api/v1/products
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_TIME
        value: 7d
      - key: COOKIE_EXPIRES_TIME
        value: "7"
      # Frontend URL, no trailing slash (set after the frontend is created)
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

  # ───────────── Frontend: Vite/React static site ─────────────
  - type: web
    name: koeshin-web
    runtime: static
    branch: ui-polish
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA fallback for React Router (BrowserRouter)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      # Backend URL + /api/v1  e.g. https://koeshin-api.onrender.com/api/v1
      - key: VITE_API
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
